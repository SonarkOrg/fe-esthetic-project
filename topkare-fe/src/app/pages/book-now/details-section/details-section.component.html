<section class="details wrap">
  <article class="detail" *ngFor="let d of details; let i = index" [class.detail--flip]="i % 2 === 1">
    <div class="detail__media" [appReveal]="0" [revealVariant]="i % 2 ? 'right' : 'left'">
      <div class="detail__img plx">
        <div class="plx__layer" [appParallax]="0.14">
          <img [src]="d.img" [alt]="d.alt" loading="lazy" />
        </div>
      </div>
    </div>
    <div class="detail__text" [appReveal]="140">
      <h2 class="detail__title">{{ d.title }}</h2>
      <p>{{ d.text }}</p>
      <a class="pill pill--sage" routerLink="/contact">Discover what we can do for you</a>
    </div>
  </article>
</section>
