<section class="courses wrap">
  <h1 class="courses__title" appReveal>
    Learn from the <span class="accent-green">best</span><br />
    <span class="courses__ink">and join our classes</span>
  </h1>
  <div class="cards">
    <div class="cards__item" *ngFor="let item of items; let i = index" [appReveal]="i * 130">
      <article class="course">
        <a class="course__img zoom" [routerLink]="['/specific-class', item.id]" [attr.aria-label]="(item.service | titlecase) + ' class'">
          <img [src]="item.img" [alt]="(item.service | titlecase) + ' class'" loading="lazy" />
        </a>
        <h2 class="course__name">{{ item.service | titlecase }}</h2>
        <a class="pill" [routerLink]="['/specific-class', item.id]">Learn more</a>
      </article>
    </div>
  </div>
</section>
